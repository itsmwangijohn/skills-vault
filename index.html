<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillVault - Learning Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <!-- Authentication Container -->
        <div id="authContainer" class="auth-box">
            <h1>SkillVault</h1>
            <p id="authMessage" class="auth-message"></p>

            <!-- Login Section -->
            <div id="loginSection">
                <h2>Welcome Back</h2>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="loginEmail">Email Address</label>
                        <input type="email" id="loginEmail" placeholder="developer@example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <input type="password" id="loginPassword" placeholder="Enter your password" required>
                    </div>
                    <button type="submit" class="btn primary-btn">Sign In</button>
                </form>
                <div class="switch-auth">
                    <p>Don't have an account?</p>
                    <button type="button" id="showRegister" class="btn secondary-btn">Sign Up</button>
                </div>
            </div>

            <!-- Register Section (Hidden by default) -->
            <div id="registerSection" class="hidden">
                <h2>Create Account</h2>
                <form id="registerForm">
                    <div class="form-group">
                        <label for="regEmail">Email Address</label>
                        <input type="email" id="regEmail" placeholder="developer@example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="regPassword">Password</label>
                        <input type="password" id="regPassword" placeholder="Minimum 6 characters" required
                            minlength="6">
                    </div>
                    <button type="submit" class="btn primary-btn">Register</button>
                </form>
                <div class="switch-auth">
                    <p>Already have an account?</p>
                    <button type="button" id="showLogin" class="btn secondary-btn">Sign In</button>
                </div>
            </div>
        </div>

        <!-- Dashboard Container (Hidden until logged in) -->
        <div id="dashboardContainer" class="dashboard hidden">
            <header class="dashboard-header">
                <h2>SkillVault Dashboard</h2>
                <div class="user-info">
                    <span id="userEmailDisplay"></span>
                    <button id="logoutBtn" class="btn danger-btn">Logout</button>
                </div>
            </header>

            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Total Skills</h3>
                    <p id="statSkills">0</p>
                </div>
                <div class="stat-card">
                    <h3>Total Hours</h3>
                    <p id="statHours">0</p>
                </div>
            </div>

            <section class="add-skill-section">
                <h3>Add New Skill</h3>
                <form id="skillForm" class="skill-form">
                    <input type="text" id="skillName" placeholder="Skill name (e.g., Python, CCNA)" required>
                    <input type="number" id="skillHours" placeholder="Hours spent" min="1" required>
                    <select id="skillStatus">
                        <option value="learning">Learning</option>
                        <option value="completed">Completed</option>
                    </select>
                    <button type="submit" class="btn primary-btn">Add Skill</button>
                </form>
            </section>

            <section class="skills-list-section">
                <h3>Your Skills</h3>
                <ul id="skillsList"></ul>
            </section>
        </div>
    </div>

    <!-- Supabase SDK CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Main Application Logic -->
    <script src="script.js"></script>
</body>

</html>
